<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container">
      <div class="todo-card">
        <h1 class="header-title">My To Do List</h1>
          <button type="button" id="theme-toggle" class="theme-toggle">Dark Mode</button>
            
          <div class="input-group">
              <input type="text" id="quick-input" placeholder="Mau ngapain hari ini, Bosku?" autocomplete="off">
              <button type="button" id="btn-tambah" class="btn-dark">Tambah</button>
          </div>

    <!--
      TODO (Fitur #3 - Filter Task):
      Tambahkan 3 tombol filter di sini: "Semua", "Aktif", "Selesai".
      Lihat README.md bagian "Fitur yang Harus Dibuat" nomor 3 untuk hint lengkap.

      Contoh struktur:
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Aktif</button>
        <button class="filter-btn" data-filter="completed">Selesai</button>
      </div>
    -->
          <div class="filters" id="filters">
              <button class="filter-btn active" data-filter="all">Semua</button>
              <button class="filter-btn" data-filter="active">Aktif</button>
              <button class="filter-btn" data-filter="completed">Selesai</button>
          </div>

          <div class="section">
              <h2 class="section-title">Fokus Hari Ini</h2>
              <div id="list-hari-ini" class="task-list"></div>
            </div>
            <div class="section">
              <h2 class="section-title">Antrean Besok</h2>
              <div id="list-besok" class="task-list"></div>
            </div>
            <div class="section">
              <h2 class="section-title">Lihat Tanggal Dulu</h2>
              <div id="list-kapan" class="task-list"></div>
            </div>
            <div class="section">
              <h2 class="section-title">Yang Udah Kelar</h2>
              <div id="list-kelar" class="task-list"></div>
            </div>

    <!--
      TODO (Fitur #5 - Counter & Fitur #6 - Clear Completed):
      Tambahkan info jumlah task tersisa dan tombol untuk menghapus
      semua task yang sudah selesai. Lihat README.md nomor 5 dan 6.

      Contoh struktur:
      <div class="footer" id="footer">
        <span id="task-counter">0 task tersisa</span>
        <button id="clear-completed">Hapus yang Selesai</button>
      </div>
    -->

    <div class="footer" id="footer">
        <span id="task-counter">0 task tersisa</span>
        <button id="clear-completed" class="clear-btn">Hapus yang Selesai</button>
    </div>

        <ul id="task-list" class="task-list">
      <!-- Task dirender otomatis oleh js/app.js, jangan ditulis manual di sini -->
    </ul>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 class="modal-title">Nambah Beban Hidup Baru</h2>
            <input type="text" id="modal-input" class="modal-input" placeholder="Ketik kegiatan di sini...">
            
            <div class="modal-section">
                <h3>Tingkat Prioritas</h3>
                <div class="btn-group" id="group-panik">
                    <button class="btn-pill active" data-value="PENTING">PENTING</button>
                    <button class="btn-pill" data-value="SANTAI">SANTAI</button>
                    <button class="btn-pill" data-value="NANTI DULU">NANTI DULU</button>
                </div>
            </div>
            <div class="modal-section">
                <h3>Kapan Dikerjain?</h3>
                <div class="btn-group" id="group-kapan">
                    <button class="btn-pill active" data-value="Hari Ini">Hari Ini</button>
                    <button class="btn-pill" data-value="Besok">Besok</button>
                    <button class="btn-pill" data-value="Pilih Tanggal">Lihat Tanggal Dulu</button>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-batal" class="btn-text">Gak Jadi Deh</button>
                <button type="button" id="btn-submit" class="btn-dark">Tambah</button>
            </div>
        </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
